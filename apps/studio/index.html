<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#18161b" />
    <title>Zence R2 — Estudio Audiovisual</title>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background:
          radial-gradient(circle at 50% 44%, rgba(174, 104, 173, 0.14), transparent 56%),
          #141216;
        font: 13px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        transition: opacity 380ms ease;
      }

      #splash.is-gone {
        opacity: 0;
        pointer-events: none;
      }

      /* Escena radial audiovisual de Zence R2 */
      .splash-stage {
        position: relative;
        width: 184px;
        height: 184px;
        display: grid;
        place-items: center;
      }

      .splash-stage::before {
        content: "";
        position: absolute;
        inset: 12px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(174, 104, 173, 0.24) 0%, rgba(174, 104, 173, 0.06) 46%, transparent 72%);
        filter: blur(8px);
        animation: splash-core-pulse 2.2s ease-in-out infinite alternate;
      }

      .splash-radial {
        position: relative;
        width: 184px;
        height: 184px;
        overflow: visible;
      }

      .splash-spin-cw {
        transform-origin: 92px 92px;
        animation: splash-spin 16s linear infinite;
      }

      .splash-spin-ccw {
        transform-origin: 92px 92px;
        animation: splash-spin 9.5s linear infinite reverse;
      }

      .splash-rays {
        transform-origin: 92px 92px;
        animation: splash-spin 22s linear infinite;
      }

      .splash-rays line {
        stroke: #cf8acc;
        stroke-linecap: round;
        transform-origin: 92px 92px;
        animation: splash-ray-pulse 1.15s ease-in-out infinite alternate;
      }

      .splash-rays line:nth-child(3n) {
        stroke: #f5f3f4;
        animation-delay: -0.35s;
      }

      .splash-rays line:nth-child(4n) {
        stroke: #ae68ad;
        animation-delay: -0.75s;
      }

      .splash-rays line:nth-child(5n) {
        animation-delay: -0.18s;
      }

      .splash-core-ring {
        transform-origin: 92px 92px;
        animation: splash-ring-breathe 1.6s ease-in-out infinite alternate;
      }

      .splash-core-dot {
        transform-origin: 92px 92px;
        animation: splash-dot-breathe 1.1s ease-in-out infinite alternate;
      }

      @keyframes splash-spin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }

      @keyframes splash-ray-pulse {
        0%   { opacity: 0.28; transform: scale(0.86); }
        100% { opacity: 1; transform: scale(1.06); }
      }

      @keyframes splash-ring-breathe {
        0%   { transform: scale(0.94); opacity: 0.72; }
        100% { transform: scale(1.04); opacity: 1; }
      }

      @keyframes splash-dot-breathe {
        0%   { transform: scale(0.82); opacity: 0.85; }
        100% { transform: scale(1.12); opacity: 1; }
      }

      @keyframes splash-core-pulse {
        0%   { opacity: 0.65; transform: scale(0.92); }
        100% { opacity: 1; transform: scale(1.08); }
      }

      .splash-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        margin: 0;
        padding: 0 16px;
        text-align: center;
      }

      .splash-zence {
        margin: 0;
        font-size: clamp(26px, 4.4vw, 34px);
        font-weight: 800;
        line-height: 1;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #f5f3f4;
        text-indent: 0.14em;
      }

      .splash-zence span {
        color: #ae68ad;
      }

      .splash-sub {
        margin: 0;
        font-size: clamp(10px, 1.4vw, 11.5px);
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #cfc8d2;
        text-indent: 0.22em;
      }

      .splash-version {
        margin: 6px 0 0;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #9e8ca4;
        text-indent: 0.24em;
      }

      /* Barras de señal audiovisual */
      .splash-wave {
        display: flex;
        align-items: flex-end;
        gap: 4px;
        height: 16px;
        margin-top: 4px;
      }

      .splash-wave i {
        display: block;
        width: 3px;
        height: 4px;
        background: #ae68ad;
        animation: splash-bar 0.9s ease-in-out infinite alternate;
      }

      .splash-wave i:nth-child(2) { animation-delay: 0.12s; background: #cf8acc; }
      .splash-wave i:nth-child(3) { animation-delay: 0.24s; background: #f5f3f4; }
      .splash-wave i:nth-child(4) { animation-delay: 0.36s; background: #cf8acc; }
      .splash-wave i:nth-child(5) { animation-delay: 0.48s; }

      @keyframes splash-bar {
        from { height: 4px; opacity: 0.45; }
        to   { height: 16px; opacity: 1; }
      }

      .splash-dev {
        position: absolute;
        right: 18px;
        bottom: 16px;
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 0;
        font-size: 11px;
        color: #847a88;
      }

      .splash-dev-tag {
        padding: 0 5px;
        border-radius: 3px;
        background: rgba(174, 104, 173, 0.16);
        color: #cf8acc;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.1em;
        line-height: 16px;
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-stage::before,
        .splash-spin-cw,
        .splash-spin-ccw,
        .splash-rays,
        .splash-rays line,
        .splash-core-ring,
        .splash-core-dot,
        .splash-wave i {
          animation: none;
        }
        #splash { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="splash" role="status" aria-label="Cargando Zence R2">
      <div class="splash-stage" aria-hidden="true">
        <svg class="splash-radial" viewBox="0 0 184 184" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="zence-core" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#f5f3f4" stop-opacity="0.95" />
              <stop offset="35%" stop-color="#cf8acc" stop-opacity="0.85" />
              <stop offset="72%" stop-color="#ae68ad" stop-opacity="0.32" />
              <stop offset="100%" stop-color="#141216" stop-opacity="0" />
            </radialGradient>
          </defs>
          <!-- Anillo exterior segmentado -->
          <g class="splash-spin-cw">
            <circle cx="92" cy="92" r="84" stroke="rgba(174,104,173,0.28)" stroke-width="1.2" stroke-dasharray="14 8 4 8" />
            <circle cx="92" cy="92" r="76" stroke="#ae68ad" stroke-width="2.2" stroke-dasharray="28 18 8 18" stroke-linecap="round" opacity="0.82" />
            <circle cx="92" cy="8" r="2.6" fill="#f5f3f4" />
            <circle cx="176" cy="92" r="2.6" fill="#cf8acc" />
            <circle cx="92" cy="176" r="2.6" fill="#f5f3f4" />
            <circle cx="8" cy="92" r="2.6" fill="#cf8acc" />
          </g>
          <!-- Barras espectrales radiales -->
          <g class="splash-rays" stroke-width="2.2">
            <line x1="92" y1="30" x2="92" y2="45" />
            <line x1="92" y1="30" x2="92" y2="49" transform="rotate(15 92 92)" />
            <line x1="92" y1="32" x2="92" y2="45" transform="rotate(30 92 92)" />
            <line x1="92" y1="27" x2="92" y2="51" transform="rotate(45 92 92)" />
            <line x1="92" y1="31" x2="92" y2="46" transform="rotate(60 92 92)" />
            <line x1="92" y1="29" x2="92" y2="49" transform="rotate(75 92 92)" />
            <line x1="92" y1="30" x2="92" y2="45" transform="rotate(90 92 92)" />
            <line x1="92" y1="28" x2="92" y2="50" transform="rotate(105 92 92)" />
            <line x1="92" y1="31" x2="92" y2="46" transform="rotate(120 92 92)" />
            <line x1="92" y1="27" x2="92" y2="51" transform="rotate(135 92 92)" />
            <line x1="92" y1="30" x2="92" y2="47" transform="rotate(150 92 92)" />
            <line x1="92" y1="32" x2="92" y2="45" transform="rotate(165 92 92)" />
            <line x1="92" y1="28" x2="92" y2="50" transform="rotate(180 92 92)" />
            <line x1="92" y1="31" x2="92" y2="46" transform="rotate(195 92 92)" />
            <line x1="92" y1="29" x2="92" y2="49" transform="rotate(210 92 92)" />
            <line x1="92" y1="27" x2="92" y2="51" transform="rotate(225 92 92)" />
            <line x1="92" y1="31" x2="92" y2="46" transform="rotate(240 92 92)" />
            <line x1="92" y1="30" x2="92" y2="48" transform="rotate(255 92 92)" />
            <line x1="92" y1="28" x2="92" y2="50" transform="rotate(270 92 92)" />
            <line x1="92" y1="32" x2="92" y2="45" transform="rotate(285 92 92)" />
            <line x1="92" y1="29" x2="92" y2="49" transform="rotate(300 92 92)" />
            <line x1="92" y1="27" x2="92" y2="51" transform="rotate(315 92 92)" />
            <line x1="92" y1="30" x2="92" y2="46" transform="rotate(330 92 92)" />
            <line x1="92" y1="31" x2="92" y2="49" transform="rotate(345 92 92)" />
          </g>
          <!-- Anillo medio contrarrotatorio -->
          <g class="splash-spin-ccw">
            <circle cx="92" cy="92" r="56" stroke="#cf8acc" stroke-width="1.6" stroke-dasharray="10 6 2 6" opacity="0.78" />
            <circle cx="92" cy="92" r="46" stroke="rgba(245,243,244,0.34)" stroke-width="1" stroke-dasharray="3 5" />
          </g>
          <!-- Anillos y núcleo central -->
          <circle class="splash-core-ring" cx="92" cy="92" r="34" stroke="#ae68ad" stroke-width="3.2" opacity="0.92" />
          <circle class="splash-core-ring" cx="92" cy="92" r="24" stroke="#f5f3f4" stroke-width="1.4" opacity="0.86" />
          <circle class="splash-core-dot" cx="92" cy="92" r="17" fill="url(#zence-core)" />
          <circle class="splash-core-dot" cx="92" cy="92" r="5" fill="#141216" stroke="#cf8acc" stroke-width="2" />
        </svg>
      </div>

      <div class="splash-brand">
        <p class="splash-zence">Zence <span>R2</span></p>
        <p class="splash-sub">Audiovisual Node &amp; Live Studio</p>
        <p class="splash-version">Alpha 0.0.1</p>
      </div>

      <div class="splash-wave" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i>
      </div>

      <p class="splash-dev"><span class="splash-dev-tag">DEV</span>wilzamguerrero</p>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
