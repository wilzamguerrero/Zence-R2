<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#202020" />
    <title>Zence R2 — Estudio Audiovisual</title>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #202020;
        font: 13px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        transition: opacity 380ms ease;
      }

      #splash.is-gone {
        opacity: 0;
        pointer-events: none;
      }

      /* Marco brutalista de ondas op-art para Zence R2 */
      .splash-stage {
        position: relative;
        width: 176px;
        height: 196px;
        border: 1.5px solid #3c3c3c;
        background: #202020;
        overflow: hidden;
      }

      .splash-stage::after {
        content: "";
        position: absolute;
        inset: 0;
        border: 1px solid rgba(174, 104, 173, 0.32);
        pointer-events: none;
      }

      .splash-brutal {
        display: block;
        width: 100%;
        height: 100%;
      }

      .splash-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        margin: 0;
        padding: 0 16px;
        text-align: center;
      }

      .splash-zence {
        margin: 0;
        font-size: clamp(26px, 4.4vw, 34px);
        font-weight: 800;
        line-height: 1;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #f5f3f4;
        text-indent: 0.14em;
      }

      .splash-zence span {
        color: #ae68ad;
      }

      .splash-sub {
        margin: 0;
        font-size: clamp(10px, 1.4vw, 11.5px);
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #cfc8d2;
        text-indent: 0.22em;
      }

      .splash-version {
        margin: 6px 0 0;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #9e8ca4;
        text-indent: 0.24em;
      }

      .splash-dev {
        position: absolute;
        right: 18px;
        bottom: 16px;
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 0;
        font-size: 11px;
        color: #847a88;
      }

      .splash-dev-tag {
        padding: 0 5px;
        background: rgba(174, 104, 173, 0.16);
        color: #cf8acc;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.1em;
        line-height: 16px;
      }

      @media (prefers-reduced-motion: reduce) {
        #splash { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="splash" role="status" aria-label="Cargando Zence R2">
      <div class="splash-stage" aria-hidden="true">
        <canvas class="splash-brutal" id="splash-canvas" width="176" height="196"></canvas>
      </div>

      <div class="splash-brand">
        <p class="splash-zence">Zence <span>R2</span></p>
        <p class="splash-sub">Audiovisual Node &amp; Live Studio</p>
        <p class="splash-version">Alpha 0.0.1</p>
      </div>

      <p class="splash-dev"><span class="splash-dev-tag">DEV</span>wilzamguerrero</p>
    </div>

    <script>
      (() => {
        const canvas = document.getElementById("splash-canvas");
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        if (!ctx) return;
        const w = canvas.width;
        const h = canvas.height;
        const img = ctx.createImageData(w, h);
        const data = img.data;
        const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
        const t0 = performance.now();

        function draw(now) {
          if (!document.body.contains(canvas)) return;
          const t = (now - t0) * 0.0014;
          let p = 0;
          for (let y = 0; y < h; y++) {
            const ny = (y / h) * 2 - 1;
            for (let x = 0; x < w; x++) {
              const nx = (x / w) * 2 - 1;
              // Campo de curvatura op-art estilo brutalista (bandas líquidas en movimiento)
              const dx = nx + 0.55;
              const dy = ny + 0.35;
              const r1 = Math.hypot(dx, dy);
              const r2 = Math.hypot(nx - 0.65, ny - 0.55);
              const warp =
                Math.sin(nx * 2.4 + Math.cos(ny * 2.1 - t * 0.9)) * 0.72 +
                Math.cos(ny * 2.7 - Math.sin(nx * 1.9 + t * 0.75)) * 0.54;
              const field = r1 * 4.4 - r2 * 1.95 + warp - t * 0.85;
              const stripe = Math.sin(field * Math.PI);
              // Borde nítido (anti-aliased estrecho) entre #202020 (32) y #f5f3f4 (245,243,244)
              const k = stripe > 0.06 ? 1 : stripe < -0.06 ? 0 : (stripe + 0.06) / 0.12;
              data[p] = 32 + (245 - 32) * k;
              data[p + 1] = 32 + (243 - 32) * k;
              data[p + 2] = 32 + (244 - 32) * k;
              data[p + 3] = 255;
              p += 4;
            }
          }
          ctx.putImageData(img, 0, 0);
          if (!reduced) requestAnimationFrame(draw);
        }

        requestAnimationFrame(draw);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
